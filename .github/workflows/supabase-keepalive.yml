name: Supabase Keep-Alive Ping

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 06:00 UTC (morning)
    - cron: '0 18 * * *'  # Daily at 18:00 UTC (evening — double coverage)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "ERROR: SUPABASE_URL or SUPABASE_ANON_KEY secret is missing"
            exit 1
          fi
          echo "Secrets present"

      - name: Check and unpause project if paused
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_REF != '' }}
        run: |
          REF="${{ secrets.SUPABASE_PROJECT_REF }}"
          TOKEN="${{ secrets.SUPABASE_ACCESS_TOKEN }}"

          status=$(curl -s \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.supabase.com/v1/projects/${REF}" \
            | grep -o '"status":"[^"]*"' | cut -d'"' -f4)

          echo "Project status: ${status}"

          if [ "${status}" = "INACTIVE" ] || [ "${status}" = "PAUSED" ]; then
            echo "Project is paused — sending restore request..."
            restore_code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://api.supabase.com/v1/projects/${REF}/restore")
            echo "Restore response: HTTP ${restore_code}"
          else
            echo "Project is active (${status}) — no restore needed"
          fi

      - name: Activity — REST API (recipes list)
        run: |
          URL="${{ secrets.SUPABASE_URL }}"
          URL="${URL%/}"
          KEY="${{ secrets.SUPABASE_ANON_KEY }}"

          response=$(curl -s -w "\n%{http_code}" \
            -H "apikey: ${KEY}" \
            "${URL}/rest/v1/recipes?select=id,name&limit=5")

          body=$(echo "$response" | head -n -1)
          http_code=$(echo "$response" | tail -n1)
          echo "recipes list → HTTP ${http_code} | body: ${body}"

          [ "${http_code}" = "200" ] || { echo "FAIL"; exit 1; }

      - name: Activity — REST API (single recipe)
        run: |
          URL="${{ secrets.SUPABASE_URL }}"
          URL="${URL%/}"
          KEY="${{ secrets.SUPABASE_ANON_KEY }}"

          response=$(curl -s -w "\n%{http_code}" \
            -H "apikey: ${KEY}" \
            "${URL}/rest/v1/recipes?select=id,name,description&limit=1&order=id.asc")

          http_code=$(echo "$response" | tail -n1)
          echo "single recipe → HTTP ${http_code}"

          [ "${http_code}" = "200" ] || { echo "FAIL"; exit 1; }

      - name: Activity — REST API (count query)
        run: |
          URL="${{ secrets.SUPABASE_URL }}"
          URL="${URL%/}"
          KEY="${{ secrets.SUPABASE_ANON_KEY }}"

          response=$(curl -s -w "\n%{http_code}" \
            -H "apikey: ${KEY}" \
            -H "Prefer: count=exact" \
            "${URL}/rest/v1/recipes?select=id")

          http_code=$(echo "$response" | tail -n1)
          echo "count query → HTTP ${http_code}"

          [ "${http_code}" = "200" ] || echo "⚠ count query returned ${http_code} (non-fatal)"

      - name: Activity — Auth service health
        run: |
          URL="${{ secrets.SUPABASE_URL }}"
          URL="${URL%/}"
          KEY="${{ secrets.SUPABASE_ANON_KEY }}"

          http_code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${KEY}" \
            "${URL}/auth/v1/health")

          echo "auth health → HTTP ${http_code}"
          [ "${http_code}" = "200" ] || echo "⚠ auth health returned ${http_code} (non-fatal)"

      - name: Activity — Storage service health
        run: |
          URL="${{ secrets.SUPABASE_URL }}"
          URL="${URL%/}"
          KEY="${{ secrets.SUPABASE_ANON_KEY }}"

          http_code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${KEY}" \
            "${URL}/storage/v1/health")

          echo "storage health → HTTP ${http_code}"
          [ "${http_code}" = "200" ] || echo "⚠ storage health returned ${http_code} (non-fatal)"

      - name: Summary
        run: echo "✓ Keep-alive complete at $(date -u)"
